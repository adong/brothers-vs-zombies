<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b6a2f">
<title>Brothers vs Zombies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1a22;
    --cream: #fff7e0;
    --gold: #ffd21f;
    --cw: 70px;
    --title: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Nunito", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b6a2f; color: var(--ink); font-family: var(--body);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: var(--body); cursor: pointer; color: var(--ink); }
  .hidden { display: none !important; }

  /* ---------------- HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 6px;
    padding: calc(6px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left));
    background: linear-gradient(#8a5a32, #6e4524); border-bottom: 4px solid #4a2c14; box-shadow: 0 4px 0 rgba(0,0,0,0.18); }
  #money { flex: none; width: calc(var(--cw) * 1.15); height: calc(var(--cw) * 1.25); background: #3a2410; border: 3px solid var(--ink);
    border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  #money .star { font-size: calc(var(--cw) * 0.48); line-height: 1; }
  #money b { font: 900 calc(var(--cw) * 0.36) var(--body); line-height: 1.1; }
  #money.pulse { animation: pulse 0.25s; }
  #money.shake { animation: shake 0.4s; }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  #cards { display: flex; gap: 5px; flex: 1; min-width: 0; }
  .card { position: relative; flex: none; width: var(--cw); height: calc(var(--cw) * 1.25); background: var(--cream); border: 3px solid var(--ink);
    border-radius: 12px; overflow: hidden; transition: transform 0.12s; touch-action: none; }
  .card img { position: absolute; left: 4%; top: 2%; width: 92%; height: 74%; object-fit: contain; pointer-events: none; }
  .card .cost { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; display: flex; align-items: center; justify-content: center;
    font: 900 calc(var(--cw) * 0.24) var(--body); background: #ffe7a6; border-top: 2px solid var(--ink); }
  .card .key { position: absolute; right: 3px; top: 1px; font: 900 calc(var(--cw) * 0.15) var(--body); color: rgba(27,26,34,0.45); }
  .card .cool { position: absolute; left: 0; right: 0; top: 0; height: 0; background: rgba(20,18,31,0.55); pointer-events: none; }
  .card.poor img { filter: grayscale(0.8) brightness(0.8); }
  .card.poor .cost { color: #b03020; }
  .card.sel { transform: translateY(5px) scale(1.06); box-shadow: 0 0 0 4px var(--gold), 0 0 18px var(--gold); z-index: 2; }
  .card.hero { background: linear-gradient(#bfe0ff, #8cc2ff); }
  .card.hero.tommy { background: linear-gradient(#ffe4b0, #ffb02e); }
  .card.hero img { top: 0; height: 76%; }
  .card.new::after { content: 'NEW'; position: absolute; left: -2px; top: 4px; background: #ff4d6d; color: #fff; font: 900 calc(var(--cw) * 0.14) var(--body);
    padding: 1px 4px; border-radius: 0 6px 6px 0; }
  #pack { flex: none; width: calc(var(--cw) * 0.8); height: calc(var(--cw) * 1.25); border: 3px solid var(--ink); border-radius: 12px; background: #d9c39a;
    font-size: calc(var(--cw) * 0.42); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  #pack small { font: 900 calc(var(--cw) * 0.13) var(--body); margin-top: 4px; }
  #pack.sel { box-shadow: 0 0 0 4px var(--gold); transform: translateY(5px); }
  #corner { flex: none; display: flex; flex-direction: column; gap: 6px; margin-left: auto; }
  .round { width: calc(var(--cw) * 0.6); height: calc(var(--cw) * 0.56); border: 3px solid var(--ink); border-radius: 12px; background: var(--cream);
    font: 900 calc(var(--cw) * 0.24) var(--body); display: flex; align-items: center; justify-content: center; padding: 0; }

  #buddyBtn { position: absolute; left: calc(10px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom)); width: 112px; height: 124px;
    border: 4px solid var(--ink); border-radius: 22px; background: linear-gradient(#fff3c4, #ffc24a); padding: 0; overflow: hidden;
    box-shadow: 0 5px 0 rgba(0,0,0,0.25); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  #buddyBtn img { width: 104px; height: 92px; object-fit: cover; object-position: center top; margin-bottom: -6px; pointer-events: none; }
  #buddyBtn span { font: 900 17px var(--title); background: var(--ink); color: #fff; width: 100%; text-align: center; padding: 3px 0 4px; }
  #buddyBtn .key { position: absolute; top: 4px; right: 7px; background: none; width: auto; color: rgba(27,26,34,0.5); font: 900 14px var(--body); padding: 0; }
  #buddyBtn:active { transform: translateY(3px) scale(0.97); }
  #buddyBtn.here { animation: glow 0.9s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 0 3px #fff, 0 0 16px #ffd21f; } to { box-shadow: 0 0 0 6px #ffd21f, 0 0 30px #ffd21f; } }
  #buddyBar { position: absolute; left: calc(132px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 6px;
    background: rgba(27,26,34,0.65); padding: 4px 10px 4px 4px; border-radius: 30px; pointer-events: none; }
  #buddyBar img { width: 38px; height: 38px; border-radius: 50%; background: #ffe7a6; object-fit: cover; object-position: center top; }
  #buddyBar .bar { width: 130px; height: 14px; background: #3a3646; border-radius: 8px; overflow: hidden; border: 2px solid #fff; }
  #buddyBar .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffb02e, #ffe066); }
  #buddyBar b { color: #fff; font: 900 13px var(--body); }

  #meter { position: absolute; right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); background: rgba(27,26,34,0.72); color: #fff;
    border-radius: 16px; padding: 6px 12px 8px; min-width: 220px; pointer-events: none; }
  #meter .name { font: 900 13px var(--body); white-space: nowrap; }
  #meter .track { position: relative; height: 16px; margin-top: 5px; background: #5a5568; border: 2px solid #fff; border-radius: 9px; }
  #meter .track i { position: absolute; right: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #7bd93f, #b6f24a); border-radius: 7px; }
  #meter .track img { position: absolute; top: -12px; width: 34px; height: 34px; margin-left: -17px; right: 0; }
  #meter .track .flag { position: absolute; left: -6px; top: -16px; font-size: 20px; }

  #hint { position: absolute; left: 50%; top: calc(var(--cw) * 1.25 + 30px); transform: translateX(-50%); max-width: min(560px, 86vw); text-align: center;
    background: #fff; border: 4px solid var(--ink); border-radius: 18px; padding: 10px 18px; font: 900 clamp(17px, 2.3vw, 24px) var(--body);
    box-shadow: 0 6px 0 rgba(0,0,0,0.2); pointer-events: none; }
  #hint:empty { display: none; }

  #toasts { position: fixed; left: 50%; top: 38%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 5; }
  .toast { background: var(--ink); color: #fff; font: 900 clamp(18px, 2.6vw, 28px) var(--body); padding: 8px 20px; border-radius: 30px; border: 3px solid #fff;
    white-space: nowrap; animation: toastIn 0.25s ease-out; box-shadow: 0 6px 0 rgba(0,0,0,0.25); }
  .toast.big { background: linear-gradient(#ffe066, #ffb02e); color: var(--ink); border-color: var(--ink); font-family: var(--title); font-weight: 400; }
  .toast.warn { background: #fff; color: #b03020; border-color: var(--ink); font-size: clamp(16px, 2.1vw, 22px); }
  @keyframes toastIn { from { transform: scale(0.4); opacity: 0; } }
  #banner { position: fixed; left: 0; right: 0; top: 40%; transform: translateY(-50%); text-align: center; pointer-events: none; z-index: 6;
    font: 400 clamp(38px, 8vw, 96px) var(--title); color: #fff; -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(0,0,0,0.3); }
  #banner.show { animation: bannerIn 0.35s cubic-bezier(.2,1.6,.4,1); }
  #banner.huge { color: #ff5a3c; }
  #banner small { display: block; font-size: 0.38em; -webkit-text-stroke: 2px var(--ink); }
  @keyframes bannerIn { from { transform: translateY(-50%) scale(0.2); opacity: 0; } }
  #flyers { position: fixed; inset: 0; pointer-events: none; z-index: 7; }
  #flyers span { position: absolute; font-size: 34px; margin: -20px 0 0 -20px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }

  /* ---------------- screens */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); overflow-y: auto; touch-action: pan-y; }
  .screen > * { flex-shrink: 0; }
  .dim { background: rgba(20, 30, 20, 0.45); }
  .panel { background: var(--cream); border: 5px solid var(--ink); border-radius: 26px; padding: 18px 22px; box-shadow: 0 10px 0 rgba(0,0,0,0.3); text-align: center; max-width: 94vw; }
  h1.logo { margin: 0; font: 400 clamp(34px, 7.4vw, 86px) / 0.95 var(--title); color: #ffe066; -webkit-text-stroke: 3px var(--ink);
    text-shadow: 0 7px 0 var(--ink), 0 0 40px rgba(0,0,0,0.35); text-align: center; letter-spacing: 1px; }
  h1.logo em { font-style: normal; color: #9dff6a; }
  .sub { font: 900 clamp(18px, 2.6vw, 28px) var(--body); color: #fff; text-shadow: 0 3px 0 var(--ink); margin-top: -6px; text-align: center; }
  .who { display: flex; gap: 18px; }
  .pick { width: clamp(130px, 19vw, 190px); border: 5px solid var(--ink); border-radius: 22px; background: #fff; padding: 6px 6px 0; overflow: hidden;
    box-shadow: 0 7px 0 rgba(0,0,0,0.3); transition: transform 0.12s; }
  .pick img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; pointer-events: none; }
  .pick span { display: block; margin: 0 -6px; padding: 6px 0 8px; background: var(--ink); color: #fff; font: 400 clamp(18px, 2.4vw, 26px) var(--title); }
  .pick.teddy { background: linear-gradient(#e2f0ff, #8cc2ff); }
  .pick.tommy { background: linear-gradient(#fff2d6, #ffb02e); }
  .pick.on { transform: translateY(-6px) scale(1.06); box-shadow: 0 0 0 6px var(--gold), 0 12px 0 rgba(0,0,0,0.3); }
  .pick:not(.on) { filter: saturate(0.6) brightness(0.92); }
  .buddyline { font: 900 clamp(15px, 2vw, 20px) var(--body); color: #fff; text-shadow: 0 2px 0 var(--ink); display: flex; align-items: center; gap: 8px; }
  .buddyline img { width: 40px; height: 40px; border-radius: 50%; background: #ffe7a6; border: 3px solid var(--ink); object-fit: cover; object-position: center top; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .btn { border: 4px solid var(--ink); border-radius: 20px; background: #fff; font: 400 clamp(20px, 2.6vw, 28px) var(--title); padding: 12px 24px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.3); min-height: 64px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .btn.go { background: linear-gradient(#b6f24a, #5fc23a); font-size: clamp(26px, 3.6vw, 40px); padding: 12px 40px; }
  .btn.small { font-size: clamp(16px, 2vw, 20px); min-height: 54px; padding: 8px 16px; }
  .toggle.on { background: linear-gradient(#fff3a0, #ffd21f); }

  #levels .worlds { display: flex; flex-direction: column; gap: 12px; }
  .world { display: flex; align-items: center; gap: 10px; background: rgba(255,247,224,0.94); border: 4px solid var(--ink); border-radius: 22px; padding: 8px 12px; }
  .world.night { background: rgba(200,205,240,0.95); }
  .world.pool { background: rgba(200,240,255,0.95); }
  .world h3 { margin: 0; width: 120px; font: 400 16px var(--title); text-align: center; }
  .world h3 b { display: block; font-size: 30px; }
  .lvl { position: relative; width: clamp(92px, 12.5vw, 128px); height: clamp(92px, 11vw, 112px); border: 4px solid var(--ink); border-radius: 18px; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; box-shadow: 0 5px 0 rgba(0,0,0,0.25); }
  .lvl b { font: 400 clamp(20px, 2.6vw, 28px) var(--title); line-height: 1; }
  .lvl small { font: 900 11px var(--body); line-height: 1.1; margin-top: 2px; }
  .lvl .st { font-size: 18px; letter-spacing: 1px; color: #e0a000; line-height: 1.1; }
  .lvl .st i { font-style: normal; color: #c9c3b0; }
  .lvl img.unlock { position: absolute; right: -10px; top: -12px; width: 40px; height: 40px; background: #fff; border: 3px solid var(--ink); border-radius: 50%; padding: 2px; }
  .lvl .boss { position: absolute; left: -8px; top: -12px; font-size: 26px; }
  .lvl.locked { background: #b8b2a2; color: #6b6658; }
  .lvl.locked::after { content: '🔒'; position: absolute; font-size: 34px; }
  .lvl.locked > * { opacity: 0.25; }
  .lvl.next { animation: nudge 1.2s infinite; }
  @keyframes nudge { 50% { transform: translateY(-5px); box-shadow: 0 0 0 5px var(--gold), 0 9px 0 rgba(0,0,0,0.25); } }

  #result { justify-content: flex-start; padding-top: max(16px, 4vh); }
  #result .stars { font-size: clamp(48px, 7vw, 74px); letter-spacing: 6px; line-height: 1; margin: 6px 0; }
  #result .stars i { font-style: normal; filter: grayscale(1) opacity(0.35); }
  #result h2 { margin: 0; font: 400 clamp(26px, 4.4vw, 46px) / 1.05 var(--title); }
  #result p { margin: 6px 0; font: 900 clamp(16px, 2vw, 22px) var(--body); }
  .newcard { display: flex; align-items: center; gap: 12px; background: #fff; border: 4px solid var(--ink); border-radius: 18px; padding: 8px 14px; margin: 8px auto 2px; max-width: 420px; text-align: left; }
  .newcard img { width: 76px; height: 76px; object-fit: contain; }
  .newcard b { font: 400 18px var(--title); color: #e8463c; display: block; }
  #pause h2 { font: 400 clamp(34px, 5vw, 56px) var(--title); margin: 0 0 6px; }
  #rotate { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: #fff; font: 900 16px var(--body);
    padding: 8px 16px; border-radius: 20px; z-index: 20; pointer-events: none; display: none; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } }
  /* small phones on their side: smaller corner buttons so the lawn stays clear */
  @media (max-height: 520px) {
    #buddyBtn { width: 76px; height: 86px; border-radius: 16px; border-width: 3px; }
    #buddyBtn img { width: 70px; height: 62px; }
    #buddyBtn span { font-size: 12px; }
    #buddyBar { left: calc(94px + env(safe-area-inset-left)); bottom: calc(10px + env(safe-area-inset-bottom)); }
    #buddyBar img { width: 30px; height: 30px; }
    #buddyBar .bar { width: 90px; }
    #meter { min-width: 150px; padding: 4px 9px 6px; }
    #meter .name { font-size: 11px; }
    #hint { top: calc(var(--cw) * 1.25 + 22px); font-size: 15px; padding: 6px 12px; }
    .screen { justify-content: flex-start; gap: 8px; }
    h1.logo { font-size: clamp(28px, 6vw, 48px); }
    .pick { width: 112px; }
    .btn { min-height: 52px; padding: 8px 18px; }
    .btn.go { padding: 8px 28px; }
    .lvl { height: 78px; width: 90px; }
    .world h3 { width: 90px; font-size: 12px; }
    .world h3 b { font-size: 22px; }
  }
  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="topbar">
    <div id="money"><span class="star">⭐</span><b id="moneyN">0</b></div>
    <div id="cards"></div>
    <button id="pack" title="Pack up a defender (half the stars back)">🧺<small>PACK UP</small></button>
    <div id="corner">
      <button class="round" id="btnPause" title="Pause (P)">❚❚</button>
      <button class="round" id="btnMute" title="Sound (M)">🔊</button>
    </div>
  </div>
  <button id="buddyBtn" title="Call your brother (T)"><img id="buddyImg" alt=""><span id="buddyName">TOMMY!</span><span class="key">T</span></button>
  <div id="buddyBar" class="hidden"><img id="buddyFace" alt=""><div class="bar"><i></i></div></div>
  <div id="meter"><div class="name" id="levelName"></div><div class="track"><i></i><span class="flag">🚩</span><img id="meterHead" alt=""></div></div>
  <div id="hint"></div>
</div>
<div id="toasts"></div>
<div id="banner"></div>
<div id="flyers"></div>

<div id="title" class="screen">
  <h1 class="logo" id="logo">Brothers <em>vs</em> Zombies</h1>
  <div class="sub">Save the cookies! 🍪</div>
  <div class="who">
    <button class="pick teddy" data-who="teddy"><img alt="Teddy"><span>TEDDY</span></button>
    <button class="pick tommy" data-who="tommy"><img alt="Tommy"><span>TOMMY</span></button>
  </div>
  <div class="buddyline"><img id="titleBuddy" alt=""><span id="titleBuddyText">Your buddy TOMMY comes when you call him!</span></div>
  <div class="row">
    <button class="btn go" id="btnPlay">▶ PLAY</button>
    <button class="btn small toggle" id="btnEasy">🐣 EASY</button>
  </div>
</div>

<div id="levels" class="screen dim hidden">
  <div class="row"><button class="btn small" id="btnBack">◀ BACK</button><h1 class="logo" style="font-size:clamp(28px,4.4vw,48px)">Pick a level</h1></div>
  <div class="worlds" id="worlds"></div>
</div>

<div id="pause" class="screen dim hidden">
  <div class="panel">
    <h2>PAUSED</h2>
    <div class="row">
      <button class="btn go" id="btnResume">▶ PLAY</button>
      <button class="btn small" id="btnRestart">↻ AGAIN</button>
      <button class="btn small" id="btnPauseLevels">LEVELS</button>
    </div>
    <p class="row"><button class="btn small toggle" id="btnEasy2">🐣 EASY</button></p>
  </div>
</div>

<div id="result" class="screen dim hidden">
  <div class="panel">
    <h2 id="resTitle"></h2>
    <div class="stars" id="resStars"></div>
    <p id="resText"></p>
    <div id="resCard"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn go" id="btnNext">NEXT ▶</button>
      <button class="btn small" id="btnAgain">↻ AGAIN</button>
      <button class="btn small" id="btnResLevels">LEVELS</button>
    </div>
  </div>
</div>
<div id="rotate">↻ Turn sideways for a bigger lawn</div>

<script src="kit/three.min.js"></script>
<script src="kit/gfx.js"></script>
<script src="kit/people.js"></script>
<script src="kit/roster.js"></script>
<script src="kit/portraits.js"></script>
<script src="kit/sound.js"></script>
<script src="kit/help.js"></script>
<script src="js/title.js"></script>
<script src="js/units.js"></script>
<script src="js/levels.js"></script>
<script src="js/sim.js"></script>
<script src="js/bot.js"></script>
<script src="js/models.js"></script>
<script src="js/sfx.js"></script>
<script src="js/view.js"></script>
<script src="js/game.js"></script>
<script src="js/keys.js"></script>
</body>
</html>
